services:
  # Serveur web PHP de l'application
  php:
    # Construit l'image à partir du Dockerfile du projet
    build: .
    container_name: vite_gourmand_php
    ports:
      # Site accessible sur http://localhost:8080
      - "8080:80"
    volumes:
      # Partage les fichiers du projet avec le conteneur PHP
      - .:/var/www/html
    depends_on:
      # Démarre ces services avant PHP, sans attendre qu'ils soient prêts
      - mysql
      - mongodb

  # Serveur de base de données MySQL
  mysql:
    image: mysql:8.0
    container_name: vite_gourmand_mysql
    environment:
      # Mot de passe administrateur pour l'environnement local
      MYSQL_ROOT_PASSWORD: root
      # Base créée lors de la première initialisation
      MYSQL_DATABASE: vite_gourmand
    ports:
      # Accès à MySQL depuis Windows sur le port 3306
      - "3306:3306"
    volumes:
      # Conserve les données MySQL dans un volume Docker
      - mysql_data:/var/lib/mysql
      # Exécute ce fichier SQL uniquement lors de la première
      # initialisation, si le volume MySQL est vide
      - ./database/vite_gourmand.sql:/docker-entrypoint-initdb.d/01_structure.sql

      # Le montage de vite_gourmand_data.sql a été retiré :
      # ce chemin correspond actuellement à un dossier, pas à un fichier SQL

  # Interface web d'administration de MySQL
  phpmyadmin:
    image: phpmyadmin
    container_name: vite_gourmand_phpmyadmin
    ports:
      # Interface accessible sur http://localhost:8082
      - "8082:80"
    environment:
      # Nom du service MySQL auquel phpMyAdmin se connecte
      PMA_HOST: mysql
    depends_on:
      - mysql

  # Serveur de base de données MongoDB
  mongodb:
    image: mongo:6.0
    container_name: vite_gourmand_mongodb
    ports:
      # Accès à MongoDB depuis Windows sur le port 27017
      - "27017:27017"
    volumes:
      # Conserve les données MongoDB dans un volume Docker
      - mongo_data:/data/db

# Volumes persistants : les données survivent à l'arrêt des conteneurs
volumes:
  mysql_data:
  mongo_data: