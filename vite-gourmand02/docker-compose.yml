services:
  # Serveur PHP
  php:
    build: .
    container_name: vite_gourmand_php
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - mongodb

  # Base de données MySQL
  mysql:
    image: mysql:8.0
    container_name: vite_gourmand_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vite_gourmand
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/vite_gourmand.sql:/docker-entrypoint-initdb.d/01_structure.sql
      - ./database/vite_gourmand_data.sql:/docker-entrypoint-initdb.d/02_data.sql

  # PhpMyAdmin
  phpmyadmin:
    image: phpmyadmin
    container_name: vite_gourmand_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql

  # MongoDB
  mongodb:
    image: mongo:6.0
    container_name: vite_gourmand_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data: