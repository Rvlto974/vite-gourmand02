# Configuration de l’application Fly.io « vite-et-gourmand-app02 »
# Le nom doit correspondre exactement à une application existante sur ton compte.
app = "vite-et-gourmand-app02"

# Région principale : Paris
primary_region = "cdg"

[build]
  # Dockerfile utilisé pour construire l’image de l’application
  dockerfile = "Dockerfile"

[http_service]
  # Port sur lequel le serveur web écoute dans le conteneur
  internal_port = 80

  # Redirige automatiquement le trafic HTTP vers HTTPS
  force_https = true

  # Arrête automatiquement les machines lorsqu’elles ne sont pas utilisées
  auto_stop_machines = "stop"

  # Redémarre une machine lorsqu’une requête arrive
  auto_start_machines = true

  # Nombre minimal de machines à garder en fonctionnement
  # 0 signifie qu’elles peuvent toutes s’arrêter en l’absence de trafic
  min_machines_running = 0

  # Processus qui reçoit le trafic HTTP
  processes = ["app"]

[[vm]]
  # Mémoire allouée à la machine virtuelle
  memory = "256mb"

  # Nombre de processeurs virtuels
  cpus = 1

  # Mémoire indiquée en mégaoctets
  memory_mb = 256